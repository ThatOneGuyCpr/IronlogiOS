name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SideStore appends your Apple team ID to the app's bundle ID but leaves the Watch
  # app's IDs alone, so the full IPA bakes the renamed IDs in ahead of time.
  SIDESTORE_TEAM_ID: 9A8T35KRG6

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "ios|watch" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app and widget
        run: |
          set -o pipefail
          xcodebuild -project Ironlog.xcodeproj -target Ironlog \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Ironlog.app

      - name: Build Watch app
        run: |
          set -o pipefail
          xcodebuild -project Ironlog.xcodeproj -target IronlogWatch \
            -configuration Release -sdk watchos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee watch.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-watchos/IronlogWatch.app

      - name: Package IPAs
        run: |
          set -e
          APP=build/Release-iphoneos/Ironlog.app
          WATCH=build/Release-watchos/IronlogWatch.app
          mkdir -p out

          # Without the Watch app (fallback if SideStore rejects the Watch part)
          rm -rf stage && mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          codesign -f -s - --entitlements Widget/IronlogWidget.entitlements stage/Payload/Ironlog.app/PlugIns/IronlogWidget.appex
          codesign -f -s - --entitlements App/Ironlog.entitlements stage/Payload/Ironlog.app
          (cd stage && zip -qry ../out/Ironlog-phone-only.ipa Payload)

          # Full app with the Watch app embedded
          rm -rf stage && mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          mkdir -p stage/Payload/Ironlog.app/Watch
          cp -R "$WATCH" stage/Payload/Ironlog.app/Watch/
          WPLIST=stage/Payload/Ironlog.app/Watch/IronlogWatch.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.ironlog.app.${SIDESTORE_TEAM_ID}" "$WPLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ironlog.app.${SIDESTORE_TEAM_ID}.watchkitapp" "$WPLIST"
          codesign -f -s - --entitlements Widget/IronlogWidget.entitlements stage/Payload/Ironlog.app/PlugIns/IronlogWidget.appex
          codesign -f -s - --entitlements Watch/IronlogWatch.entitlements stage/Payload/Ironlog.app/Watch/IronlogWatch.app
          codesign -f -s - --entitlements App/Ironlog.entitlements stage/Payload/Ironlog.app
          (cd stage && zip -qry ../out/Ironlog.ipa Payload)

          ls -la out
          find stage/Payload -maxdepth 3 -name "*.app*"

      - name: Report build contents
        if: always()
        run: |
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')"
          for f in ios.log watch.log; do
            [ -f "$f" ] || continue
            grep -E "error:" "$f" | sort -u | head -25 | while IFS= read -r line; do echo "::error title=$f::$line"; done
          done
          if [ -d stage/Payload ]; then
            echo "::notice title=Bundles::$(cd stage/Payload && find . -maxdepth 4 \( -name '*.app' -o -name '*.appex' \) | tr '\n' ' ')"
            echo "::notice title=Sizes::$(ls -la out | awk 'NR>1{print $5, $9}' | tr '\n' ' ')"
            W=stage/Payload/Ironlog.app/Watch/IronlogWatch.app
            echo "::notice title=Watch plist::companion=$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' $W/Info.plist) id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $W/Info.plist) archs=$(lipo -archs $W/IronlogWatch)"
            echo "::notice title=App entitlements::$(codesign -d --entitlements - --xml stage/Payload/Ironlog.app 2>/dev/null | tr -d '\n\t' | head -c 600)"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.ipa \
            --title "Ironlog build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA::7}. Install Ironlog.ipa with SideStore; use Ironlog-phone-only.ipa if the Watch app causes trouble." \
            --latest

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Ironlog-IPA
          path: out/*.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore
